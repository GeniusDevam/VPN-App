name: emulator-only
# Re-runs just the emulator test against the x86_64 APK of an earlier build (no rebuild).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID of an earlier 'build' run that has the apk-universal artifact"
        required: true

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # pushes the redacted results branch
      actions: read     # downloads the apk artifact of an earlier run
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apk-universal
          path: out
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Enable KVM and emulator runtime libraries
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libpulse0 libnss3 libxcomposite1 libxcursor1 libxi6 libxtst6 || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run the app in an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio -no-boot-anim -camera-back none -camera-front none
          script: OUT=emu-out bash tools/emulator-test.sh out/VPN-App.apk || echo $? > emu-exit
      - name: Interpret the emulator verdict
        run: |
          code=$(cat emu-exit 2>/dev/null || echo 0); [ -f emu-out/result.txt ] || code=1
          case "$code" in 0) v=PASS ;; 3) v=INCONCLUSIVE ;; *) v=FAIL ;; esac
          { echo "### Emulator verdict: $v"; sed -n '/^status=/,$p' emu-out/result.txt 2>/dev/null | sed 's/^/    /'; } >> "$GITHUB_STEP_SUMMARY"
          [ "$v" = INCONCLUSIVE ] && echo "::warning::Live servers were unreachable; connection success is NOT demonstrated."
          [ "$v" != FAIL ]
      # The branch is public. Raw logcat and UI dumps are NEVER published: only a redacted summary.
      - name: Publish redacted results to the emulator-results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 -I tools/redact-results.py emu-out emu-public
          cd emu-public && git init -q && git checkout -q -b emulator-results && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "emulator-only run ${GITHUB_RUN_NUMBER}, redacted"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" emulator-results
