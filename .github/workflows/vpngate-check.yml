name: vpngate-check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenVPN
        run: sudo apt-get update -qq && sudo apt-get install -y -qq openvpn && openvpn --version | head -2
      - name: Try real OpenVPN against live VPN Gate servers
        run: python3 tools/vpngate-check.py
