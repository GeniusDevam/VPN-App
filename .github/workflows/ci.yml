name: build
on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }

      - name: Print Android library versions available on Google Maven
        run: |
          for a in androidx/compose/compose-bom androidx/activity/activity-compose androidx/lifecycle/lifecycle-viewmodel-compose androidx/lifecycle/lifecycle-runtime-compose androidx/core/core-ktx androidx/glance/glance-appwidget; do
            echo "== $a"; curl -fsSL https://dl.google.com/dl/android/maven2/$a/maven-metadata.xml | grep -E '<(latest|release)>' || echo "(none)"
          done
          echo "== kotlin compose plugin"; curl -fsSL https://plugins.gradle.org/m2/org/jetbrains/kotlin/plugin/compose/org.jetbrains.kotlin.plugin.compose.gradle.plugin/maven-metadata.xml | grep -E '<(latest|release)>' || true

      - name: Install SDK pieces and swig
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq swig
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;30.0.14904198" "platforms;android-37" "cmake;3.22.1" || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed | head -40

      - name: Prepare build tree
        run: tools/prepare.sh

      - name: Build (arm64, OpenVPN 2.x, skeleton UI)
        working-directory: build-tree
        run: ./gradlew --no-daemon :main:assembleSkeletonOvpn2Release -PicsopenvpnDebugSign

      - name: Collect APK
        run: |
          find build-tree/main/build/outputs -name '*.apk' -exec ls -la {} \;
          mkdir -p out && find build-tree/main/build/outputs -name '*.apk' -exec cp {} out/ \;
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: out/*.apk, if-no-files-found: error }
