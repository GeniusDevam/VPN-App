name: build
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Engine unit tests (includes the 35-second guarantee test)
        working-directory: engine
        run: gradle test --console=plain

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The x86_64 build exists only for the emulator test; it must never block the real (arm64) release.
    continue-on-error: ${{ matrix.abi == 'x86_64' }}
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]   # arm64 is the real app; x86_64 only exists for the emulator test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }

      - name: Install SDK pieces and swig
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq swig
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;30.0.16248370" "platforms;android-37.0" "cmake;3.22.1" || true

      - name: Prepare build tree
        run: tools/prepare.sh

      - name: Build signed release APK (arm64, OpenVPN 2.x)
        working-directory: build-tree
        run: |
          ./gradlew --no-daemon --stacktrace :main:assembleSkeletonOvpn2Release \
            -PvpnappVersionCode=$((1000 + GITHUB_RUN_NUMBER)) \
            -PvpnappAbi=${{ matrix.abi }} \
            -PkeystoreO2File="$GITHUB_WORKSPACE/tools/release.jks" \
            -PkeystoreO2Password=vpnapp-release \
            -PkeystoreO2AliasPassword=vpnapp-release \
            -PkeystoreO2Alias=vpnapp

      - name: Collect APK
        run: |
          mkdir -p out
          apk=$(find build-tree/main/build/outputs/apk -name '*.apk' | head -1)
          echo "APK: $apk"; ls -la "$apk"
          cp "$apk" out/VPN-App.apk

      - name: Inspect APK (permissions, entry points, 16 KB alignment)
        continue-on-error: true
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1); echo "build-tools: $BT"
          "$BT/aapt2" dump badging out/VPN-App.apk | grep -E "^package:|^sdkVersion|^targetSdkVersion|^application-label:|launchable-activity|^native-code|uses-permission: name" || true
          echo "--- zipalign 16 KB check"; "$BT/zipalign" -c -P 16 -v 4 out/VPN-App.apk | tail -3 || true
          echo "--- ELF segment alignment"
          python3 -I - <<'PY'
          import zipfile,struct
          z=zipfile.ZipFile('out/VPN-App.apk')
          for n in z.namelist():
              if n.endswith('.so'):
                  d=z.read(n)
                  if d[:4]!=b'\x7fELF' or d[4]!=2: continue
                  phoff=struct.unpack_from('<Q',d,32)[0]; phentsize,phnum=struct.unpack_from('<HH',d,54)
                  al=[struct.unpack_from('<Q',d,phoff+i*phentsize+48)[0] for i in range(phnum) if struct.unpack_from('<I',d,phoff+i*phentsize)[0]==1]
                  print(n, 'LOAD align', sorted(set(al)), 'OK(16K)' if min(al)>=16384 else 'NOT 16K')
          PY
      - uses: actions/upload-artifact@v4
        with: { name: "apk-${{ matrix.abi }}", path: out/VPN-App.apk, if-no-files-found: error }

  release:
    needs: [engine, apk]
    if: github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: apk-arm64-v8a, path: out }
      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          Install: open this page on your phone, tap **VPN-App.apk**, then tap Open/Install.
          Build #${GITHUB_RUN_NUMBER} from commit ${GITHUB_SHA::7}.
          NOTES
          gh release delete latest --cleanup-tag -y --repo "$GITHUB_REPOSITORY" || true
          gh release create latest out/VPN-App.apk --repo "$GITHUB_REPOSITORY" \
            --title "VPN App (latest build)" --notes-file notes.md --target "$GITHUB_SHA" --latest

  emulator:
    needs: [apk]
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: apk-x86_64, path: out }
      - name: Is the VPN Gate list reachable from here?
        continue-on-error: true
        run: |
          for u in https://www.vpngate.net/api/iphone/ http://www.vpngate.net/api/iphone/; do
            echo "== $u"; curl -sS -m 30 -o /tmp/list.csv -w "HTTP %{http_code}, %{size_download} bytes, %{time_total}s\n" "$u" || true
            head -c 400 /tmp/list.csv | cut -c1-200; echo; grep -c ',' /tmp/list.csv || true
          done
      - name: Enable KVM and emulator runtime libraries
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libpulse0 libnss3 libxcomposite1 libxcursor1 libxi6 libxtst6 || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run the app in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-save -noaudio -no-boot-anim -camera-back none -camera-front none
          script: OUT=emu-out bash tools/emulator-test.sh out/VPN-App.apk
      - name: Publish emulator results to the emulator-results branch
        if: always()
        run: |
          cd emu-out && git init -q && git checkout -q -b emulator-results && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "emulator run ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" emulator-results
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: emulator-results, path: emu-out, if-no-files-found: warn }
